openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: JobTracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: admin
    description: Admin
  - name: applications
    description: Job applications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Bad request
        "409":
          description: Email already in use

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized

  /auth/otp/request:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: Send a one-time email code (used for OTP login and password reset)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInput"
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResult"
        "400":
          description: Bad request
        "429":
          description: Too many requests — resend cooldown in effect

  /auth/otp/login:
    post:
      operationId: otpLogin
      tags: [auth]
      summary: Log in (or sign up) with an emailed one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Bad request
        "401":
          description: Invalid or expired code

  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password after verifying an emailed one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetInput"
      responses:
        "200":
          description: Password updated
        "400":
          description: Bad request
        "401":
          description: Invalid or expired code
        "404":
          description: No account with that email

  /auth/verify/request:
    post:
      operationId: requestEmailVerification
      tags: [auth]
      summary: (Re)send a verification code to the current user's own email
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResult"
        "401":
          description: Unauthorized
        "429":
          description: Too many requests — resend cooldown in effect

  /auth/verify/confirm:
    post:
      operationId: confirmEmailVerification
      tags: [auth]
      summary: Confirm the current user's email with a one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyConfirmInput"
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized, or invalid/expired code

  /auth/providers:
    get:
      operationId: getAuthProviders
      tags: [auth]
      summary: Which optional sign-in providers are configured
      responses:
        "200":
          description: Provider availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"

  /auth/google:
    get:
      operationId: googleLogin
      tags: [auth]
      summary: Start the Google OAuth sign-in flow (browser redirect, not for XHR)
      responses:
        "302":
          description: Redirect to Google's consent screen
        "501":
          description: Google sign-in is not configured

  /auth/google/callback:
    get:
      operationId: googleCallback
      tags: [auth]
      summary: Google OAuth redirect target — completes login and redirects to the frontend
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect back to the frontend, logged in (or with an ?error= query param)
        "501":
          description: Google sign-in is not configured

  /admin/setup:
    get:
      operationId: getAdminSetupStatus
      tags: [admin]
      summary: Whether an admin account already exists
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSetupStatus"
    post:
      operationId: bootstrapAdmin
      tags: [admin]
      summary: Bootstrap the first admin account using a one-time setup token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSetupInput"
      responses:
        "200":
          description: Admin created/promoted
        "400":
          description: Bad request
        "401":
          description: Invalid setup token
        "409":
          description: Admin account already exists
        "503":
          description: ADMIN_SETUP_TOKEN is not configured

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — admin access required

  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List applications
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
        - name: order
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
        "401":
          description: Unauthorized

    post:
      operationId: createApplication
      tags: [applications]
      summary: Create application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /applications/dashboard:
    get:
      operationId: getDashboard
      tags: [applications]
      summary: Get dashboard stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Unauthorized

  /applications/export:
    get:
      operationId: exportApplications
      tags: [applications]
      summary: Export applications as CSV
      responses:
        "200":
          description: CSV file
        "401":
          description: Unauthorized

  /applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get application by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          description: Unauthorized
        "404":
          description: Not found

    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Update application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          description: Unauthorized
        "404":
          description: Not found

    delete:
      operationId: deleteApplication
      tags: [applications]
      summary: Delete application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    RegisterInput:
      type: object
      required: [email, password]
      properties:
        name:
          type: ["string", "null"]
        email:
          type: string
        password:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthUser:
      type: object
      required: [id, email, isAdmin, emailVerifiedAt, mustVerify, verifyGraceEndsAt]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: ["string", "null"]
        isAdmin:
          type: boolean
        emailVerifiedAt:
          type: ["string", "null"]
        mustVerify:
          type: boolean
          description: True once the email-verification grace period has elapsed for an unverified account — the app must be fully blocked until verified.
        verifyGraceEndsAt:
          type: string
          description: ISO timestamp — when the grace period ends (createdAt + 48h) for an unverified account.

    OtpRequestInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    OtpRequestResult:
      type: object
      required: [ok, resendIn]
      properties:
        ok:
          type: boolean
        resendIn:
          type: integer
          description: Seconds to wait before requesting another code.
        alreadyVerified:
          type: boolean

    OtpLoginInput:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
        code:
          type: string

    PasswordResetInput:
      type: object
      required: [email, code, newPassword]
      properties:
        email:
          type: string
        code:
          type: string
        newPassword:
          type: string

    VerifyConfirmInput:
      type: object
      required: [code]
      properties:
        code:
          type: string

    AuthProviders:
      type: object
      required: [google]
      properties:
        google:
          type: boolean

    AdminSetupStatus:
      type: object
      required: [adminExists]
      properties:
        adminExists:
          type: boolean

    AdminSetupInput:
      type: object
      required: [token, email]
      properties:
        token:
          type: string
        email:
          type: string

    AdminUser:
      type: object
      required: [id, email, isAdmin, emailVerifiedAt, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: ["string", "null"]
        isAdmin:
          type: boolean
        emailVerifiedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    StatusHistory:
      type: object
      required: [id, applicationId, toStatus, changedAt]
      properties:
        id:
          type: string
        applicationId:
          type: string
        fromStatus:
          type: ["string", "null"]
        toStatus:
          type: string
        changedAt:
          type: string
        note:
          type: ["string", "null"]

    Application:
      type: object
      required: [id, userId, company, role, status, appliedDate, createdAt, updatedAt, statusHistory]
      properties:
        id:
          type: string
        userId:
          type: string
        company:
          type: string
        role:
          type: string
        jobUrl:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        salary:
          type: ["string", "null"]
        status:
          type: string
        appliedDate:
          type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        statusHistory:
          type: array
          items:
            $ref: "#/components/schemas/StatusHistory"

    ApplicationInput:
      type: object
      required: [company, role]
      properties:
        company:
          type: string
        role:
          type: string
        jobUrl:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        salary:
          type: ["string", "null"]
        status:
          type: string
        appliedDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    ApplicationUpdate:
      type: object
      properties:
        company:
          type: string
        role:
          type: string
        jobUrl:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        salary:
          type: ["string", "null"]
        status:
          type: string
        appliedDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    DashboardStats:
      type: object
      required: [total, byStatus, stale, recent]
      properties:
        total:
          type: integer
        byStatus:
          type: object
          additionalProperties:
            type: integer
        stale:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        recent:
          type: array
          items:
            $ref: "#/components/schemas/Application"
